<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Flappy Bird</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game">

        <!-- Bird -->
        <img id="bird" src="bird.png" alt="Bird">

        <!-- Score -->
        <div id="score">0</div>


        <!-- Start Screen -->
        <div id="startScreen">

            <h1>FLAPPY BIRD</h1>

            <p>Tap or press SPACE to fly</p>

            <button id="startButton">
                START
            </button>

        </div>


        <!-- Game Over -->
        <div id="gameOver">

            <h1>GAME OVER</h1>

            <p>
                Score:
                <span id="finalScore">0</span>
            </p>

            <button id="restartButton">
                RESTART
            </button>

        </div>

    </div>


    <!-- Jump Sound -->
    <audio id="jumpSound"
           src="jump.mp3"
           preload="auto">
    </audio>


    <!-- Background Music -->
    <audio id="music"
           src="music.mp3"
           preload="auto"
           loop>
    </audio>


    <script src="game.js"></script>

</body>

</html>
